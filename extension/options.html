<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Scholar Assist: My Profile and Documents</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 12px; }
      .tabs button { padding: 8px 16px; font-size: 15px; cursor: pointer; border: 1px solid #aaa; background: #eee; }
      .tabs button.active { background: #1f4e79; color: #fff; border-color: #1f4e79; }
      .panel { display: none; margin-top: 16px; }
      .panel.active { display: block; }
      .warn { background: #fff4e5; border: 1px solid #f0b36b; padding: 8px 10px; border-radius: 6px; font-size: 13px; }
      label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
      input, select { width: 100%; padding: 8px; margin-top: 4px; font-size: 15px; box-sizing: border-box; }
      .actions { margin-top: 18px; }
      .actions button { padding: 9px 18px; font-size: 15px; cursor: pointer; margin-right: 8px; }
      #saveMsg { color: #2e7d32; margin-left: 6px; }
      .doc { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
      .doc h4 { margin: 0 0 6px; }
      .saved { font-size: 13px; color: #2e7d32; margin-top: 6px; }
      .none { font-size: 13px; color: #888; margin-top: 6px; }
      .doc button { margin-left: 8px; }
    </style>
  </head>
  <body>
    <h2>Scholar Assist</h2>
    <div class="warn">Your details and files are saved on this computer only, <b>without encryption for now</b>.
      Use sample data while testing, and avoid shared computers.</div>

    <div class="tabs" style="margin-top:14px">
      <button id="tabProfile" class="active">My Profile</button>
      <button id="tabDocs">My Documents</button>
    </div>

    <div id="panelProfile" class="panel active">
      <div id="profileForm"></div>
      <div class="actions">
        <button id="saveProfile">Save profile</button>
        <button id="clearProfile">Clear profile</button>
        <span id="saveMsg"></span>
      </div>
    </div>

    <div id="panelDocs" class="panel">
      <p>Save each document once. Files stay in this browser only.</p>
      <div id="docList"></div>
    </div>

    <script src="config.js"></script>
    <script src="vault.js"></script>
    <script src="options.js"></script>
  </body>
</html>
