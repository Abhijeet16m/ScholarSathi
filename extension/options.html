<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>My Documents</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 560px; margin: 30px auto; }
      .doc { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
      .doc h4 { margin: 0 0 6px; }
      .saved { font-size: 13px; color: #2e7d32; margin-top: 6px; }
      .none { font-size: 13px; color: #888; margin-top: 6px; }
      button { margin-left: 8px; }
    </style>
  </head>
  <body>
    <h2>My Documents</h2>
    <p>Save each document once. Files stay in this browser only.</p>

    <div class="doc" data-type="photo">
      <h4>Passport photo</h4>
      <input type="file" accept="image/*" />
      <div class="status"></div>
    </div>

    <div class="doc" data-type="signature">
      <h4>Signature</h4>
      <input type="file" accept="image/*" />
      <div class="status"></div>
    </div>

    <div class="doc" data-type="incomeCert">
      <h4>Income certificate (PDF)</h4>
      <input type="file" accept="application/pdf" />
      <div class="status"></div>
    </div>

    <script src="vault.js"></script>
    <script src="options.js"></script>
  </body>
</html>
